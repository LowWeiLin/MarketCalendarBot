name: "Market Calendar Bot"

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 16 * * 1-5" # 8 AM UTC on weekdays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MARKET_CALENDAR_EXCHANGES: ${{ vars.MARKET_CALENDAR_EXCHANGES }}
      TIMEZONE: ${{ vars.TIMEZONE }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run
        run: uv run main.py
